<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./src/assets/qr-code.png" type="image/png">
    <title>QRGera | QR Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <main class="main-card animate__animated animate__fadeIn">
            <header>
                <h1>QRGera</h1>
                <h5>Crie seus códigos QR personalizados em alta resolução.</h5>
            </header>

            <form id="qr-form">
                <input type="text" id="link" placeholder="Cole seu link aqui..." required autocomplete="off">
                <button class="btn btn-primary" type="submit">Gerar QRCode</button>
            </form>

            <div id="qrcode"></div>

            <div class="actions-container" id="actions-container" style="display: none;">
                <button class="btn btn-success action-btn" id="salvar" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-download me-2" viewBox="0 0 16 16">
                        <path
                            d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
                        <path
                            d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
                    </svg>
                    Baixar
                </button>

                <button class="btn btn-info action-btn" id="compartilhar" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-share-fill me-2" viewBox="0 0 16 16">
                        <path
                            d="M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.499 2.499 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5z" />
                    </svg>
                    Compartilhar
                </button>
            </div>
        </main>
    </div>

    <footer class="text-center">
        <p class="mb-3">Dev. Silas Gonçalves</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="https://silasgoncalvesczs.github.io/linktree/" target="_blank">
                <img src="https://img.shields.io/badge/website-000000?style=for-the-badge&logo=About.me&logoColor=white"
                    alt="Portfolio">
            </a>
            <a href="https://www.linkedin.com/in/silasgoncal/" target="_blank">
                <img src="https://img.shields.io/badge/LinkedIn-0077B5?style=for-the-badge&logo=linkedin&logoColor=white"
                    alt="Linkedin">
            </a>
            <a href="https://github.com/silasgoncalvesczs" target="_blank">
                <img src="https://img.shields.io/badge/GitHub-100000?style=for-the-badge&logo=github&logoColor=white"
                    alt="Github">
            </a>
        </div>
    </footer>

    <script src="./src/qrcodejs/qrcode.min.js"></script>
    <script src="./src/html2canvas/html2canvas.min.js"></script>
    <script src="./main.js"></script>
</body>

</html>
